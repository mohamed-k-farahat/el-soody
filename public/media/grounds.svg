<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- ground coffee texture for the bowl icon -->
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.2  0 0 0 0 0.09  0 0 0 -1.4 1.1"/>
  </filter>
  <radialGradient id="shade" cx=".42" cy=".38" r=".7">
    <stop offset="0" stop-color="#8A5328"/>
    <stop offset=".7" stop-color="#4B2A12"/>
    <stop offset="1" stop-color="#2A160A"/>
  </radialGradient>
  <rect width="200" height="200" fill="url(#shade)"/>
  <rect width="200" height="200" filter="url(#g)" opacity=".75"/>
</svg>
