<!doctype html>
<!--
  A story book picture (1200 x 900, or 900 x 1200 for a tall one): the photo, a thin gold frame line, the Soody logo in the
  corner on a soft dark fade, and the origin flag for single origin coffees. No words, so the
  same picture works in the Arabic and the English book.
  Rendered by render-book-plates.py; settings come in the URL hash.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { margin: 0; overflow: hidden; background: #000; }
  .plate { position: relative; width: 1200px; height: 900px; overflow: hidden; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(1.04) contrast(1.03); }
  /* warm the photo a touch toward the shop's coffee colours, and darken the corners */
  .plate::before { content: ""; position: absolute; inset: 0; z-index: 1;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(14,10,7,.45) 100%),
                linear-gradient(0deg, rgba(14,10,7,.55) 0%, rgba(14,10,7,0) 32%); }
  .plate::after { content: ""; position: absolute; inset: 0; z-index: 1; background: rgba(110, 64, 34, .08); mix-blend-mode: multiply; }
  .frame { position: absolute; inset: 26px; z-index: 2; border: 2px solid rgba(233, 205, 150, .85); border-radius: 6px; }
  .frame::after { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(233, 205, 150, .4); border-radius: 3px; }
  .brand { position: absolute; z-index: 3; right: 56px; bottom: 50px; width: 124px; aspect-ratio: 1284 / 1632;
    background: linear-gradient(180deg, #F4E2B5, #D9B977);
    -webkit-mask: url("../../public/media/logo.png") center / contain no-repeat; mask: url("../../public/media/logo.png") center / contain no-repeat;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
  .flag { position: absolute; z-index: 3; left: 58px; top: 58px; width: 108px; height: 72px; border-radius: 6px; overflow: hidden;
    box-shadow: 0 0 0 3px rgba(233, 205, 150, .9), 0 6px 18px rgba(0,0,0,.45); }
  .flag svg { display: block; width: 100%; height: 100%; }
  /* soft steam rising from a hot cup */
  .steam { position: absolute; z-index: 2; width: 34%; aspect-ratio: 1 / 1.5; transform: translate(-50%, -100%); pointer-events: none; }
  .steam path { fill: none; stroke: url(#steamFade); stroke-linecap: round; }
</style>
</head>
<body>
<script src="../product-card/flags.js"></script>
<div class="plate" id="plate">
  <img class="photo" id="photo" alt="">
  <div class="frame"></div>
  <div class="brand"></div>
</div>
<script>
  const d = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'));
  const plate = document.getElementById('plate');
  plate.style.width = (d.w || 1200) + 'px';
  plate.style.height = (d.h || 900) + 'px';
  const photo = document.getElementById('photo');
  photo.src = d.photo;
  photo.style.objectPosition = d.focus || '50% 50%';
  if (d.steam) {
    const s = document.createElement('div');
    s.className = 'steam';
    s.style.left = d.steam.x + '%';
    s.style.top = d.steam.y + '%';
    s.innerHTML = `<svg viewBox="0 0 200 300" width="100%" height="100%">
      <defs>
        <linearGradient id="steamFade" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".18" stop-color="#fff" stop-opacity=".55"/>
          <stop offset=".65" stop-color="#fff" stop-opacity=".22"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <filter id="soft" x="-50%" y="-20%" width="200%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
      </defs>
      <g filter="url(#soft)">
        <path d="M78 300 C58 250 102 220 84 170 C68 126 108 96 92 40" stroke-width="16"/>
        <path d="M112 300 C132 252 92 214 114 160 C132 116 100 82 122 20" stroke-width="20"/>
        <path d="M96 290 C110 248 80 226 98 186 C112 156 90 132 104 96" stroke-width="10" opacity=".7"/>
      </g>
    </svg>`;
    document.getElementById('plate').appendChild(s);
  }
  if (d.flag && window.FLAGS[d.flag]) {
    const f = document.createElement('div');
    f.className = 'flag';
    f.innerHTML = window.FLAGS[d.flag];
    document.getElementById('plate').appendChild(f);
  }
</script>
</body>
</html>
