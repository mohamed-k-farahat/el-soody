<svg xmlns="http://www.w3.org/2000/svg" width="600" height="860" viewBox="0 0 600 860">
  <!-- aged book paper -->
  <filter id="fibre" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="2" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 0 0.18  0 0 0 0.35 -0.08"/>
  </filter>
  <filter id="blotch" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="3" seed="12" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.45  0 0 0 0 0.24  0 0 0 0.9 -0.38"/>
  </filter>
  <radialGradient id="edge" cx=".5" cy=".5" r=".72">
    <stop offset=".7" stop-color="#7a4f25" stop-opacity="0"/>
    <stop offset="1" stop-color="#7a4f25" stop-opacity=".22"/>
  </radialGradient>
  <rect width="100%" height="100%" fill="#F3E7D0"/>
  <rect width="100%" height="100%" filter="url(#blotch)"/>
  <rect width="100%" height="100%" filter="url(#fibre)"/>
  <rect width="100%" height="100%" fill="url(#edge)"/>
</svg>
