<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- dark walnut table top for the story book -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0018 0.06" numOctaves="4" seed="9" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.05  0 0 0 0 0.02  0 0 0 1.5 -0.35"/>
  </filter>
  <filter id="fine" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.35" numOctaves="2" seed="3" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.33  0 0 0 0 0.17  0 0 0 0.9 -0.42"/>
  </filter>
  <radialGradient id="light" cx=".5" cy=".42" r=".75">
    <stop offset="0" stop-color="#6b3f20" stop-opacity=".55"/>
    <stop offset="1" stop-color="#0b0604" stop-opacity=".85"/>
  </radialGradient>
  <rect width="100%" height="100%" fill="#3a2214"/>
  <rect width="100%" height="100%" filter="url(#fine)"/>
  <rect width="100%" height="100%" filter="url(#grain)"/>
  <rect width="100%" height="100%" fill="url(#light)"/>
</svg>
