    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.32  0 0 0 0 0.17  0 0 0 0 0.08  0 0 0 1 -0.42"/>
  </filter>
  <radialGradient id="sheen" cx=".38" cy=".3" r=".9">
    <stop offset="0" stop-color="#5a3219" stop-opacity=".55"/>
    <stop offset="1" stop-color="#050302" stop-opacity=".7"/>
  </radialGradient>
  <rect width="100%" height="100%" fill="#24140b"/>
